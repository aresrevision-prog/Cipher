<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cipher</title>
<meta name="theme-color" content="#6246ea">
<meta name="description" content="Private, end-to-end encrypted messaging">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f7;--panel:#ffffffd9;--solid:#fff;--ink:#12131a;--mute:#6b7085;--line:#e3e5ef;--acc:#6246ea;--acc2:#2f80ed;--accink:#fff;--them:#fff;--chat:#f5f6fb;--bad:#e5484d;--shadow:0 10px 40px -12px #1b1f4a33;
--grad:linear-gradient(135deg,var(--acc),var(--acc2));
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0c12;--panel:#14161fd9;--solid:#14161f;--ink:#ecedf3;--mute:#8c90a6;--line:#232636;--acc:#7c64ff;--acc2:#3d8bff;--them:#1e2130;--chat:#0f1018;--shadow:0 10px 40px -12px #000a}}
:root[data-theme="dark"]{--bg:#0b0c12;--panel:#14161fd9;--solid:#14161f;--ink:#ecedf3;--mute:#8c90a6;--line:#232636;--acc:#7c64ff;--acc2:#3d8bff;--them:#1e2130;--chat:#0f1018;--shadow:0 10px 40px -12px #000a}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:11px 16px;background:var(--grad);color:var(--accink);font-weight:700;flex:none;transition:transform .12s,filter .15s,opacity .15s;box-shadow:0 6px 18px -8px var(--acc)}
button:hover{filter:brightness(1.08)}button:active{transform:scale(.97)}
button.ghost{background:transparent;color:var(--mute);padding:8px;box-shadow:none;border-radius:10px;display:inline-flex;align-items:center;justify-content:center}
button.ghost:hover{background:var(--line);color:var(--ink);filter:none}
button.danger{background:transparent;color:var(--bad);border:1.5px solid color-mix(in srgb,var(--bad) 45%,transparent);box-shadow:none}
button:disabled{opacity:.5;cursor:default;transform:none}
svg.i{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
input,select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--solid);outline:none;transition:border-color .15s,box-shadow .15s}
input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--acc);padding:0}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
.hide{display:none!important}
.center{height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
#auth{background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--acc) 35%,transparent),transparent 60%),radial-gradient(900px 600px at 110% 110%,color-mix(in srgb,var(--acc2) 30%,transparent),transparent 60%),var(--bg)}
.card{background:var(--solid);border:1px solid var(--line);border-radius:22px;padding:26px;width:100%;max-width:410px;display:flex;flex-direction:column;gap:13px;max-height:100%;overflow-y:auto;box-shadow:var(--shadow)}
#auth .card{padding:30px}
.logo{width:56px;height:56px;border-radius:18px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 10px 26px -8px var(--acc);margin-bottom:2px}
.logo svg{width:44px;height:44px}
.card h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.card h2{margin:8px 0 0;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.card p{margin:0;color:var(--mute);font-size:13px}
.err{color:var(--bad);font-size:13px;min-height:1em;font-weight:500}
label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:6px;font-weight:600}
label.chk{flex-direction:row;align-items:center;gap:10px;font-size:14px;color:var(--ink);cursor:pointer;font-weight:500}
.row{display:flex;gap:8px;align-items:center}
#app{height:100%;display:flex;background:var(--bg)}
#side{width:340px;max-width:100%;border-right:1px solid var(--line);background:var(--solid);display:flex;flex-direction:column}
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--chat);position:relative}
#main:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(color-mix(in srgb,var(--acc) 22%,transparent) 1px,transparent 1px);background-size:22px 22px}
.bar{display:flex;align-items:center;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);min-height:64px;position:relative;z-index:1}
.bar .t{flex:1;min-width:0}
.bar .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.bar .t small{color:var(--mute);font-size:12px}
#cHead{cursor:pointer;display:flex;align-items:center;gap:10px}
#cHead .tx{min-width:0;flex:1}
.tabs{display:flex;gap:4px;padding:4px;margin:10px 12px 0;background:var(--bg);border-radius:12px}
.tabs button{flex:1;background:transparent;color:var(--mute);border-radius:9px;padding:8px;box-shadow:none;font-weight:600}
.tabs button.on{background:var(--solid);color:var(--ink);box-shadow:0 2px 8px -2px #0002}
#auth .tabs{margin:4px 0 2px}
.tool{display:flex;gap:8px;padding:12px}
.tool input{padding:10px 12px}
.tool button{padding:10px 13px}
.list{flex:1;overflow-y:auto;padding:0 8px 8px}
.item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;cursor:pointer;transition:background .12s}
.item:hover{background:var(--bg)}
.item.on{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.av{width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:16px}
.av svg{width:20px;height:20px}
.av.sm{width:34px;height:34px;font-size:13px}
.item .t{flex:1;min-width:0}.item .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.item small{color:var(--mute);font-size:12.5px}
.item .x{opacity:0}.item:hover .x{opacity:1}
.dot{width:10px;height:10px;border-radius:50%;background:var(--grad);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
#msgs{flex:1;overflow-y:auto;padding:18px 18px 10px;display:flex;flex-direction:column;gap:4px;position:relative}
.m{max-width:min(72%,560px);padding:9px 13px 6px;border-radius:20px 20px 20px 6px;background:var(--them);word-wrap:break-word;white-space:pre-wrap;align-self:flex-start;box-shadow:0 1px 2px #0000000f,0 4px 14px -8px #0002;animation:pop .18s ease-out}
.m.me{background:var(--grad);color:var(--accink);align-self:flex-end;border-radius:20px 20px 6px 20px}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}}
.m .who{display:block;font-size:11.5px;font-weight:700;margin-bottom:2px}
.m a{color:inherit;text-decoration:underline;text-underline-offset:2px;word-break:break-all}
.m:not(.me) a{color:var(--acc)}
.m img,.m video{display:block;max-width:100%;max-height:340px;border-radius:14px;margin:2px -7px 0;max-width:calc(100% + 14px);cursor:zoom-in}
.m video{background:#000;cursor:default}
.media{background:#0000002a;color:inherit;border-radius:14px;padding:22px 26px;font-weight:700;box-shadow:none;margin:2px 0}
.m:not(.me) .media{background:var(--bg);color:var(--ink)}
.file{display:flex;align-items:center;gap:10px;text-align:left;background:#0000002a;color:inherit;box-shadow:none;border-radius:14px;padding:10px 14px;margin:2px 0;min-width:200px;max-width:100%}
.m:not(.me) .file{background:var(--bg);color:var(--ink)}
.file svg{flex:none;width:28px;height:28px}.file span{display:flex;flex-direction:column;min-width:0}.file b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}.file small{opacity:.7;font-weight:500;font-size:12px}
.m{position:relative}
.mdel{display:none;position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;padding:0;border-radius:50%;background:var(--solid);color:var(--bad);border:1px solid var(--line);box-shadow:var(--shadow);align-items:center;justify-content:center}
.mdel svg{width:16px;height:16px}.m.me .mdel{left:-40px}.m:not(.me) .mdel{right:-40px}
.m.sel .mdel{display:flex}@media (hover:hover){.m:hover .mdel{display:flex}}
.hid{font-style:italic;opacity:.6;font-size:13px}
.voice{display:flex;align-items:center;gap:10px;min-width:220px;padding:2px 0}
.vbtn{width:40px;height:40px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;background:#ffffff33;color:inherit;box-shadow:none;flex:none}
.m:not(.me) .vbtn{background:var(--grad);color:#fff}.vbtn svg{width:18px;height:18px}
.vbar{flex:1;height:4px;border-radius:4px;background:color-mix(in srgb,currentColor 28%,transparent);overflow:hidden}.vbar i{display:block;height:100%;width:0;background:currentColor}
.voice small{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums;min-width:32px;text-align:right}
.tr{font-size:13.5px;margin-top:6px;padding-top:6px;border-top:1px solid color-mix(in srgb,currentColor 22%,transparent);opacity:.9}
.tr:before{content:"“"}.tr:after{content:"”"}.tr.none:before,.tr.none:after{content:""}
#rec{flex:1;display:flex;align-items:center;gap:10px;background:var(--solid);border:1.5px solid var(--bad);border-radius:26px;padding:4px 4px 4px 16px;min-width:0;box-shadow:var(--shadow)}
.rdot{width:10px;height:10px;border-radius:50%;background:var(--bad);flex:none;animation:blink 1s infinite}@keyframes blink{50%{opacity:.25}}
#recT{font-variant-numeric:tabular-nums;flex:none}
#recTx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute);font-size:13px}
.blk{display:flex;flex-direction:column;align-items:center;gap:12px}
#call{position:fixed;inset:0;z-index:9;background:radial-gradient(900px 600px at 50% 0%,#3a2a8a,#0b0c12 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(48px + env(safe-area-inset-top,0px)) 20px calc(36px + env(safe-area-inset-bottom,0px));overflow:hidden}
#cRemote{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:none}
#call.live.vid #cRemote{display:block}
#cLocal{position:absolute;right:16px;bottom:calc(130px + env(safe-area-inset-bottom,0px));width:110px;height:150px;object-fit:cover;border-radius:16px;transform:scaleX(-1);display:none;box-shadow:0 8px 30px #0008;border:2px solid #fff3;background:#222}
#call.vid #cLocal{display:block}
.cinfo{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.cinfo .av{width:96px;height:96px;font-size:36px;box-shadow:0 0 0 10px #ffffff12,0 0 0 22px #ffffff08}
#call:not(.live) .cinfo .av{animation:pulse 1.6s infinite}@keyframes pulse{50%{box-shadow:0 0 0 16px #ffffff1a,0 0 0 34px #ffffff0a}}
#call.live.vid .cinfo .av{display:none}
#call.live.vid .cinfo{background:#0007;padding:8px 16px;border-radius:16px;backdrop-filter:blur(8px)}
.cinfo h2{margin:6px 0 0;font-size:24px;font-weight:800}.cinfo p{margin:0;opacity:.8;font-variant-numeric:tabular-nums}
.cbtns{position:relative;display:flex;gap:22px}
.cb{width:64px;height:64px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;background:#ffffff26;color:#fff;box-shadow:none;backdrop-filter:blur(8px)}
.cb svg{width:26px;height:26px}.cb.off{background:#fff;color:#111}
.cb.dec{background:#e5484d}.cb.dec svg{transform:rotate(135deg)}.cb.acc{background:#2fb35a}
.m time{display:block;font-size:10.5px;opacity:.6;margin-top:3px;text-align:right}
.day{align-self:center;font-size:11.5px;font-weight:600;color:var(--mute);background:var(--panel);border:1px solid var(--line);padding:4px 12px;border-radius:99px;margin:10px 0 6px;backdrop-filter:blur(8px)}
.empty{margin:auto;color:var(--mute);text-align:center;font-size:14px;padding:30px;position:relative}
.empty .big{display:flex;width:64px;height:64px;margin:0 auto 12px;border-radius:20px;background:var(--grad);color:#fff;align-items:center;justify-content:center;opacity:.9}
.empty .big svg{width:30px;height:30px}
#composer{display:flex;gap:8px;padding:10px 14px 14px;align-items:center;position:relative;z-index:1}
#composer .box{flex:1;display:flex;align-items:center;gap:4px;background:var(--solid);border:1.5px solid var(--line);border-radius:26px;padding:4px 6px 4px 4px;box-shadow:var(--shadow);transition:border-color .15s}
#composer .box:focus-within{border-color:var(--acc)}
#composer .box input{border:0;box-shadow:none;background:transparent;padding:10px 6px}
#send{width:46px;height:46px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;font-size:12px}
#send svg{width:20px;height:20px;margin-left:-2px}
.ov{position:fixed;inset:0;background:#05061099;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:8;padding:16px;animation:fade .15s}
.ov .card{animation:pop .2s ease-out}
@keyframes fade{from{opacity:0}}
#view img{max-width:95%;max-height:95%;border-radius:12px}
.mem{display:flex;align-items:center;gap:10px;padding:6px 0}
.badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad);margin-left:6px}
.mem .acts{display:flex;gap:6px}.mem .acts button{padding:6px 10px;font-size:12.5px}
.mem span{flex:1;font-weight:500}
#back{display:none}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
@media (max-width:700px){#side{width:100%;border:0}#app.chat #side{display:none}#app:not(.chat) #main{display:none}#back{display:inline-flex}.m{max-width:84%}}
</style>
</head>
<body>
<div id="boot" class="center"><p style="color:var(--mute)">Loading…</p></div>

<div id="auth" class="center hide"><div class="card">
  <div class="logo" id="logo"></div><h1>Cipher</h1><p>Private, end-to-end encrypted messaging.</p>
  <div class="tabs"><button id="tLogin" class="on">Log in</button><button id="tSign">Sign up</button></div>
  <label id="fName" class="hide">Display name<input id="aName" maxlength="30" autocomplete="nickname"></label>
  <label>Number<input id="aNum" inputmode="numeric" maxlength="12" autocomplete="username"></label>
  <label>Passphrase<input id="aPass" type="password" autocomplete="current-password"></label>
  <label id="fPass2" class="hide">Repeat passphrase<input id="aPass2" type="password" autocomplete="new-password"></label>
  <label class="chk hide" id="fTerms"><input type="checkbox" id="aTerms"><span>I agree to the <a href="#" id="aTermsLink" style="color:var(--acc);font-weight:700">Terms &amp; Privacy</a></span></label>
  <label class="chk"><input type="checkbox" id="aRem" checked>Keep me logged in on this device</label>
  <p id="aHint" class="hide">Pick any free 4–12 digit number. Your passphrase (8+ characters) encrypts your key and can't be recovered.</p>
  <div class="err" id="aErr"></div>
  <button id="aGo">Log in</button>
  <button class="ghost" id="aReset">Forgot passphrase?</button>
</div></div>

<div id="app" class="hide">
  <aside id="side">
    <div class="bar"><div class="av" id="myAv"></div><div class="t"><b id="myName"></b><small id="myNum"></small></div>
      <button class="ghost hide" id="admBtn" title="Admin"></button><button class="ghost" id="setBtn" title="Settings"></button><button class="ghost" id="lockBtn" title="Log out"></button></div>
    <div class="tabs"><button data-tab="chats" class="on">Chats</button><button data-tab="contacts">Contacts</button></div>
    <div id="tabChats" style="display:contents">
      <div class="tool"><input id="newNum" placeholder="Text a number…" inputmode="numeric" maxlength="12"><button id="newGo">Go</button><button id="grpBtn" class="ghost" title="New group"></button></div>
      <div class="err" id="newErr" style="padding:0 12px"></div>
      <div class="list" id="list"></div>
    </div>
    <div id="tabContacts" class="hide" style="flex:1;display:flex;flex-direction:column;min-height:0">
      <div class="tool"><input id="cNum" placeholder="Number" inputmode="numeric" maxlength="12" style="width:40%"><input id="cNick" placeholder="Name" maxlength="30"><button id="cAdd">Add</button></div>
      <div class="err" id="cErr" style="padding:0 12px"></div>
      <div class="list" id="clist"></div>
    </div>
  </aside>
  <main id="main">
    <div class="bar"><button class="ghost" id="back"></button><div class="t" id="cHead"><div class="av sm hide" id="cAv"></div><div class="tx"><b id="cName">Pick a chat</b><small id="cSub"></small></div></div><button class="ghost hide" id="callA" title="Voice call"></button><button class="ghost hide" id="callV" title="Video call"></button><button class="ghost hide" id="infoBtn"></button></div>
    <div id="msgs"></div>
    <div id="composer" class="hide">
      <div class="box"><button class="ghost" id="photoBtn" title="Attach photos, videos or files"></button>
      <input type="file" id="file" multiple class="hide">
      <input id="txt" placeholder="Message" maxlength="4000" autocomplete="off"><button class="ghost" id="micBtn" title="Record voice message"></button></div>
      <div id="rec" class="hide"><span class="rdot"></span><b id="recT">0:00</b><span id="recTx">Listening…</span><button class="ghost" id="recX" title="Cancel"></button></div>
      <button id="send" title="Send"></button>
    </div>
  </main>
</div>
<div id="modal" class="ov hide"><div class="card"></div></div>
<div id="call" class="hide">
  <video id="cRemote" autoplay playsinline></video>
  <video id="cLocal" autoplay playsinline muted></video>
  <div class="cinfo"><div class="av" id="callAv"></div><h2 id="callName"></h2><p id="callSt"></p></div>
  <div class="cbtns" id="cIn"><button class="cb dec" id="cDecline" title="Decline"></button><button class="cb acc" id="cAccept" title="Accept"></button></div>
  <div class="cbtns hide" id="cAct"><button class="cb" id="cMute" title="Mute"></button><button class="cb" id="cCam" title="Camera"></button><button class="cb dec" id="cHang" title="Hang up"></button></div>
</div>
<div id="view" class="ov hide"><img alt=""></div>

<script>
/* ---------- Supabase db adapter ---------- */
const DB=(()=>{
  if(!window.supabase||!window.CIPHER_CONFIG||/YOUR-/.test(CIPHER_CONFIG.url))return null;
  const sb=supabase.createClient(CIPHER_CONFIG.url,CIPHER_CONFIG.anonKey);
  const parentOf=p=>p.slice(0,p.lastIndexOf('/')),idOf=p=>p.slice(p.lastIndexOf('/')+1);
  const rid=()=>Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>b.toString(16).padStart(2,'0')).join('');
  const snap=(path,row)=>({id:idOf(path),exists:!!row,data:()=>row?row.data:undefined});
  const chk=r=>{if(r.error)throw Object.assign(new Error(r.error.message),{code:r.error.code});return r.data};
  const live=new Set();let n=0;
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)live.forEach(f=>f())});
  function listen(filter,match,cb){
    let tm;const deb=()=>{clearTimeout(tm);tm=setTimeout(cb,80)};
    const ch=sb.channel('c'+(++n))
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'docs',filter},deb)
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'docs',filter},deb)
      .on('postgres_changes',{event:'DELETE',schema:'public',table:'docs'},p=>{if(p.old&&match(p.old))deb()})
      .subscribe(st=>{if(st==='SUBSCRIBED')deb()});
    live.add(cb);return()=>{live.delete(cb);clearTimeout(tm);sb.removeChannel(ch)};
  }
  function doc(path){return{id:idOf(path),path,
    async get(){return snap(path,chk(await sb.from('docs').select('data').eq('path',path).maybeSingle()))},
    async set(data){chk(await sb.from('docs').upsert({path,coll:parentOf(path),data,t:typeof data.t==='number'?data.t:0}))},
    async update(data){const s=await this.get();if(!s.exists)throw new Error('Not found');await this.set({...s.data(),...data})},
    async delete(){chk(await sb.from('docs').delete().eq('path',path))},
    onSnapshot(next,err){const go=()=>this.get().then(next,err||(()=>{}));go();return listen('path=eq.'+path,r=>r.path===path,go)}}}
  function query(coll,o={}){return{
    orderBy(f,dir){return query(coll,{...o,dir:dir||'asc'})},
    limit(k){return query(coll,{...o,k})},
    async get(){let q=sb.from('docs').select('path,data').eq('coll',coll);if(o.dir)q=q.order('t',{ascending:o.dir==='asc'});if(o.k)q=q.limit(o.k);

async function passKey(pass,salt){

}

async function sharedKey(num){
