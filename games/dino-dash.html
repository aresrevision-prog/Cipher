<style>

*{box-sizing:border-box}

.screen::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.5) 100%);box-shadow:inset 0 0 40px rgba(0,0,0,.6)}

/* chrome dino look */

<script>
let x=null; const cv=document.getElementById('c'), x0=cv.getContext('2d'), W=960, H=420, HY=150, YP=345, LW=190, UN=112, K=.12, DRAW=85; x=x0;
let hi=0, totalCoins=0, coinsRun=0, skinIdx=0, owned=[1,0,0,0,0,0];
try{ hi=+localStorage.getItem('dinoHi3')||0; totalCoins=+localStorage.getItem('dinoCoins')||0; skinIdx=+localStorage.getItem('dinoSkin')||0; const o=JSON.parse(localStorage.getItem('dinoOwned')||'null'); if(Array.isArray(o)&&o.length===5) owned=[o[0],0].concat(o.slice(1)); else if(Array.isArray(o)&&o.length===6) owned=o; }catch(e){}
function save(){ try{ localStorage.setItem('dinoHi3',hi); localStorage.setItem('dinoCoins',totalCoins); localStorage.setItem('dinoSkin',skinIdx); localStorage.setItem('dinoOwned',JSON.stringify(owned)); }catch(e){} }
const SKINS=[
 {n:'Classic',G:'#535353',DG:'#3e3e3e',LG:'#6c6c6c',OL:'#2a2a2a',p1:'#5b5b5b',p2:'#636363',pb:'#2e2e2e',cost:0},
 {n:'Forest',G:'#5fbf48',DG:'#3b8f34',LG:'#93e475',OL:'#2a6a28',p1:'#ff9d3d',p2:'#ffbd5c',pb:'#b5601a',cost:25},
 {n:'Ocean',G:'#4aa8e8',DG:'#2c78b8',LG:'#8fd4ff',OL:'#1c4f80',p1:'#ffffff',p2:'#d8f1ff',pb:'#5a8fb8',cost:40},
 {n:'Bubblegum',G:'#ff7eb6',DG:'#d94f8e',LG:'#ffc0dc',OL:'#8f2a5c',p1:'#fff36b',p2:'#ffe14a',pb:'#b89a1a',cost:80},
 {n:'Gold',G:'#f2c230',DG:'#c48f12',LG:'#fff0a0',OL:'#7a5408',p1:'#ff5a3c',p2:'#ff8a5a',pb:'#8a2a14',cost:150},
 {n:'Shadow',G:'#6b4fc9',DG:'#43308f',LG:'#a68cff',OL:'#231757',p1:'#3df0d0',p2:'#7affea',pb:'#13806e',cost:250}];
let impactDone=0, outroT=0; let introT=0, POP=null, popx=null; let runT=0, boostT=0, board=[], lastRank=0, lastEntry=null; try{ const bb=JSON.parse(localStorage.getItem('dinoBoard')||'[]'); if(Array.isArray(bb)) board=bb.filter(e=>e&&typeof e.s==='number').slice(0,10); }catch(e){}
let doom=0, booms=[], meteors=[], embers=[], caveU=0, caveT=0, caveIn=0, endT=0; let PXC=null, streak=0, streakT=0, streakShow=0; let paused=false, shield=false, inv=0, magT=0, slowT=0, dblT=0, spEff=15, rainK=0, rainOn=0, rainMode=2, rainT=20, lightning=0, muted=false, musT=0, musStep=0, toast='', toastT=0, items=[], drops=[], bestRunCoins=0;
for(let i=0;i<150;i++) drops.push({x:Math.random()*960,y:Math.random()*420,v:700+Math.random()*500});
let st='ready', t=0, last=0, score=0, speed=15, trav=0, heading=0, night=0, flash=0, shake=0, popT=0, overT=0, ac=null, nextObs=0, nextScn=0, lastMark=0, dustT=0;
const P={lane:1,lx:1,h:0,vy:0,duck:false,leg:0};
let obs=[], scn=[], parts=[], clouds=[], stars=[];
const lerp=(a,b,k)=>a+(b-a)*k, R=(a,b)=>a+Math.random()*(b-a), RI=n=>Math.floor(Math.random()*n);
const PAL=[
 {n:'DAY',  sk0:[150,205,240],sk1:[198,230,248],sk2:[240,248,250],m1:[186,206,224],m2:[172,198,170],m3:[150,186,140],g1:[242,229,198],g2:[236,221,186],r1:[214,206,192],r2:[206,198,184],fog:[240,248,250],cl:[255,255,255],clA:[1],sunY:[70],sunC:[255,214,90],glow:[255,236,160],sunA:[.9],moonA:[0],starA:[0],tint:[0,0,0,0],ink:[83,83,83]},
 {n:'DUSK', sk0:[92,72,150],sk1:[236,132,120],sk2:[255,196,140],m1:[160,112,150],m2:[128,96,130],m3:[96,84,112],g1:[226,190,160],g2:[218,180,150],r1:[178,160,160],r2:[170,152,152],fog:[255,196,140],cl:[255,170,150],clA:[1],sunY:[132],sunC:[255,180,80],glow:[255,140,80],sunA:[1],moonA:[0],starA:[.15],tint:[0,0,0,0],ink:[60,44,66]},
 {n:'NIGHT',sk0:[14,18,44],sk1:[26,32,70],sk2:[44,52,100],m1:[40,46,88],m2:[32,40,74],m3:[26,34,60],g1:[40,44,62],g2:[46,50,70],r1:[56,58,76],r2:[62,64,82],fog:[44,52,100],cl:[70,78,120],clA:[1],sunY:[170],sunC:[220,220,220],glow:[44,52,100],sunA:[0],moonA:[1],starA:[1],tint:[0,0,0,0],ink:[200,204,220]},
 {n:'DAWN', sk0:[140,160,220],sk1:[246,180,190],sk2:[255,226,170],m1:[190,170,200],m2:[170,170,180],m3:[150,166,150],g1:[242,222,196],g2:[234,212,184],r1:[212,200,196],r2:[204,192,188],fog:[255,226,170],cl:[255,226,226],clA:[1],sunY:[126],sunC:[255,226,140],glow:[255,190,150],sunA:[1],moonA:[0],starA:[.1],tint:[0,0,0,0],ink:[76,64,72]}
];
let todIdx=0, autoTod=true, todT=0, cp=JSON.parse(JSON.stringify(PAL[0]));
const rgb=a=>'rgb('+Math.round(a[0])+','+Math.round(a[1])+','+Math.round(a[2])+')';
const rgba=(a,al)=>'rgba('+Math.round(a[0])+','+Math.round(a[1])+','+Math.round(a[2])+','+al+')';
function blendPal(dt){ const tg=PAL[todIdx], k=Math.min(1,dt*1.7); for(const key in tg){ if(key==='n') continue; for(let i=0;i<tg[key].length;i++) cp[key][i]+=(tg[key][i]-cp[key][i])*k; } }
function setTod(i,auto){ todIdx=i; autoTod=!!auto; todT=0; document.querySelectorAll('#tod button').forEach(b=>b.classList.toggle('on',(b.dataset.t==='a'&&autoTod)||(!autoTod&&+b.dataset.t===todIdx))); }
const curve=u=>Math.sin(u*.032)+.8*Math.sin(u*.0117+1.3);
function rr(a,b,w,h,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }
function ell(a,b,rx,ry){ x.beginPath(); x.ellipse(a,b,Math.max(.1,rx),Math.max(.1,ry),0,0,7); x.fill(); }
function tri(a,b,c,d,e,f){ x.beginPath(); x.moveTo(a,b); x.lineTo(c,d); x.lineTo(e,f); x.fill(); }
/* where something at world distance z ahead of the player appears on screen */
function proj(z,laneF,lat){ const s=1/(1+z*K), off=520*(curve(trav+z)-curve(trav))*s; return {s,y:HY+(YP-HY)*s,x:W/2+off+((laneF-1)*LW+(lat||0))*s}; }
function beep(f,l,ty){ if(muted) return; try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain(); o.type=ty||'square'; o.frequency.value=f; g.gain.value=.04; g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+l); o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+l); }catch(e){} }
function tone(f,l,ty,v){ if(muted||!ac) return; try{ const o=ac.createOscillator(), g=ac.createGain(); o.type=ty; o.frequency.value=f; g.gain.value=v; g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+l); o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+l); }catch(e){} }
const NOTES=[0,3,5,7,10,12,10,7];
function musicTick(){ const base=[110,98,87.3,98][Math.floor(musStep/8)%4]; tone(base*Math.pow(2,NOTES[musStep%8]/12)*2,.16,'triangle',.022); if(musStep%2===0) tone(base,.22,'sine',.04); musStep++; }
function say(m){ toast=m; toastT=2.2; }
function reset(){ impactDone=0; runT=0; boostT=0; lastRank=0; lastEntry=null; doom=0; booms=[]; meteors=[]; embers=[]; caveT=0; caveIn=0; obs=[]; scn=[]; parts=[]; items=[]; coinsRun=0; shield=false; inv=0; magT=0; slowT=0; dblT=0; paused=false; score=0; speed=15; trav=0; heading=0; P.lane=1; P.lx=1; P.h=0; P.vy=0; P.duck=false; nextObs=45; nextScn=2; lastMark=0;
  clouds=[]; for(let i=0;i<6;i++) clouds.push({x:R(0,W),y:R(20,100),z:R(.7,1.3)}); stars=[]; for(let i=0;i<60;i++) stars.push({x:R(0,W),y:R(4,HY-10),r:R(.6,1.8),p:R(0,6)}); }
function start(){ if(st==='cave'||st==='intro'||st==='outro') return; if((st==='over'&&t-overT<2.6)||(st==='end'&&t-overT<.8)) return; if(st!=='play'){ reset(); st='intro'; introT=0; beep(330,.08); setTimeout(()=>beep(495,.08),90); setTimeout(()=>beep(660,.12),180); } }
function jump(){ if(st!=='play'){ start(); return; } if(P.h<=.001){ P.vy=8.4; beep(540,.09); } }
function lane(d){ if(st!=='play'){ start(); return; } const n=Math.max(0,Math.min(2,P.lane+d)); if(n!==P.lane){ P.lane=n; beep(300,.05); } }
function duck(on){ P.duck=on; if(on&&P.h>0) P.vy-=9; }
addEventListener('keydown',e=>{ const c=e.code||({' ':'Space',ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',ArrowUp:'ArrowUp',ArrowDown:'ArrowDown'})[e.key]||''; if(c==='Escape'){ e.preventDefault(); if(bdOn) showBoard(false); else igs(!igsOn); return; } if(igsOn||bdOn) return; if(c==='KeyH'){ showBoard(true); return; } if(['Space','ArrowUp','KeyW'].includes(c)){ e.preventDefault(); if(!e.repeat) jump(); } else if(['ArrowLeft','KeyA'].includes(c)){ e.preventDefault(); if(!e.repeat) lane(-1); } else if(['ArrowRight','KeyD'].includes(c)){ e.preventDefault(); if(!e.repeat) lane(1); } else if(c==='KeyT'){ setTod((todIdx+1)%4,false); } else if(c==='KeyP'){ if(st==='play') paused=!paused; uiLabels(); } else if(c==='KeyM'){ muted=!muted; uiLabels(); } else if(['ArrowDown','KeyS'].includes(c)){ e.preventDefault(); duck(true); } });
addEventListener('keyup',e=>{ if(e.code==='ArrowDown'||e.code==='KeyS') duck(false); });
let sx=0, sy=0;
cv.tabIndex=0; const grab=()=>{ try{ window.focus(); cv.focus({preventScroll:true}); }catch(e){} };
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); grab(); sx=e.clientX; sy=e.clientY; });
document.addEventListener('pointerdown',()=>{ try{ window.focus(); }catch(e){} },true);
cv.addEventListener('pointerup',e=>{ e.preventDefault(); if(igsOn||bdOn) return; const dx=e.clientX-sx, dy=e.clientY-sy; if(Math.abs(dx)>28&&Math.abs(dx)>Math.abs(dy)) lane(dx>0?1:-1); else if(dy<-28) jump(); else if(dy>28){ duck(true); setTimeout(()=>duck(false),650); } else jump(); });
const bind=(id,f,g)=>{ const b=document.getElementById(id); b.addEventListener('pointerdown',e=>{ e.preventDefault(); grab(); f(); }); if(g) ['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,g)); };

const SPAN={cactus:[0,.95],rock:[0,.5],beam:[.95,1.55],bird:[.95,1.5],fence:[0,.55],boulder:[0,.95]};
function spawnRow(z){ const r=Math.random(), pick=a=>a[RI(a.length)], ls=[0,1,2], used=[], hard=score>350;
  const add=(l,k)=>{ obs.push({u:z,lane:l,k,f:R(0,6),rot:0}); used.push(l); };
  const kinds=hard?['cactus','rock','beam','bird','fence','boulder']:['cactus','rock','beam','bird','fence'];
  if(r<.34) add(RI(3),pick(kinds));
  else if(r<.72){ const free=RI(3); ls.filter(l=>l!==free).forEach(l=>add(l,pick(kinds))); }
  else if(r<.87) ls.forEach(l=>add(l,pick(['rock','fence'])));
  else ls.forEach(l=>add(l,pick(['beam','bird'])));
  const free=ls.filter(l=>!used.includes(l)), L=free.length?pick(free):RI(3), q=Math.random();
  if(q<.52){ const n=RI(3)+4, arc=Math.random()<.35; for(let k=0;k<n;k++) items.push({u:z+3+k*2.2,lane:L,k:'coin',y:arc?.55+Math.sin(k/(n-1)*Math.PI)*1.15:.55,sp:R(0,6)}); }
  else if(q<.6) items.push({u:z+2,lane:L,k:pick(['shield','magnet','slow','dbl','boost','boost','clear','clear']),y:.8,sp:0}); }

  else { tone(660,.08,'square',.05); setTimeout(()=>tone(880,.1,'square',.05),70); setTimeout(()=>tone(1320,.14,'square',.05),150);
    if(it.k==='shield'){ shield=true; say('🛡️ SHIELD!'); } if(it.k==='boost'){ boostT=4; say('⚡ SPEED BOOST!'); } if(it.k==='clear'){ const n=clearAhead(); say('💥 '+(n?n+' OBSTACLES CLEARED!':'ROAD CLEAR!')); } if(it.k==='magnet'){ magT=9; say('🧲 COIN MAGNET'); } if(it.k==='slow'){ slowT=6; say('⏳ SLOW TIME'); } if(it.k==='dbl'){ dblT=10; say('✖2 DOUBLE POINTS & COINS'); } } }

function rumble(v){ if(muted||!ac) return; try{ const o=ac.createOscillator(), g=ac.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(70,ac.currentTime); o.frequency.exponentialRampToValueAtTime(28,ac.currentTime+.9); g.gain.value=v; g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+1); o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+1); }catch(e){} }
function boomAt(bx,by,big){ booms.push({x:bx,y:by,t:0,big:big||1}); if(big>1.5) rumble(.05); }
function worldEnd(dt){
  booms.forEach(b=>b.t+=dt); booms=booms.filter(b=>b.t<2.4);
  meteors.forEach(m=>{ m.x+=m.vx*dt; m.y+=m.vy*dt; if(m.y>=m.ty){ m.dead=1; boomAt(m.x,m.ty,1.2+Math.random()); shake=Math.max(shake,.12*doom); } }); meteors=meteors.filter(m=>!m.dead);
  embers.forEach(e=>{ e.y-=e.v*dt; e.x+=Math.sin(t*2+e.p)*20*dt; e.l-=dt; }); embers=embers.filter(e=>e.l>0&&e.y>-10);
  if(doom<=0) return;
  if(Math.random()<dt*doom*1.4) boomAt(R(40,W-40),HY-R(0,18),1+doom*1.5);
  if(doom>.25&&Math.random()<dt*(doom-.2)*2.2){ const tx=R(60,W-60), ty=HY-R(0,14), T=R(.8,1.4), vx=-R(160,280), vy=(ty+20)/T; meteors.push({x:tx-vx*T,y:-20,vx,vy,ty}); }
  if(doom>.45&&Math.random()<dt*doom*30) embers.push({x:R(0,W),y:H+5,v:R(60,160),p:R(0,6),l:R(2,5),r:R(1.5,3.5)});
  if(doom>.7) shake=Math.max(shake,.04*(doom-.6));
}
function enterCave(){ st='cave'; caveT=0; caveIn=0; caveU=trav+42; obs=obs.filter(o=>o.u>caveU+5); items=[]; P.lane=1; P.duck=false; say('FIND SHELTER!'); rumble(.07); }
function caveUpdate(dt){
  caveT+=dt; worldEnd(dt); doom=1; toastT=Math.max(0,toastT-dt);
  P.lx=lerp(P.lx,1,Math.min(1,dt*6)); if(P.h>0||P.vy>0){ P.vy-=22*dt; P.h=Math.max(0,P.h+P.vy*dt); if(P.h===0)P.vy=0; } P.leg+=dt*spEff*.55;
  parts.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=800*dt; p.l-=dt; }); parts=parts.filter(p=>p.l>0);
  if(!caveIn){ trav+=Math.max(6,spEff)*dt; if(caveU-trav<.6){ caveIn=t; beep(160,.3,'triangle'); } }
  else { const k=t-caveIn;
    if(k>1.4&&k<1.5){ rumble(.12); setTimeout(()=>rumble(.12),250); setTimeout(()=>rumble(.1),600); }
    if(k>1.4&&k<4.5) shake=Math.max(shake,.7*(1-(k-1.4)/3.1));
    if(k>1.4&&k<3) for(let i=0;i<3;i++) parts.push({x:R(0,W),y:R(-10,40),vx:R(-40,40),vy:R(20,120),l:R(.6,1.4),m:1.4,c:'r',r:R(2,6)});

  heading+=(curve(trav+1)-curve(trav))*speed*dt*.9;

  if(st!=='play'){ parts.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=800*dt; p.l-=dt; }); parts=parts.filter(p=>p.l>0); P.lx=lerp(P.lx,P.lane,Math.min(1,dt*12)); trav+=dt*(st==='ready'?6:0); return; }

}

/* the intro leap is drawn on a page-wide layer so the dino can burst past the screen edges */
/* ---- the classic offline-dino screen the game starts from ---- */
const REX_HEAD=["..........########..",".........##.#######.",".........##########.",".........##########.",".........##########.",".........#####......","........########....","#.......#####.......","#.....#######.......","##...#########......","###.###########.....","#############.#.....",".############.......","..###########.......","...#########........","....#######........."];
const REX_LEGS={stand:["....###.##..........","....##...#..........","....#....#..........","....##...##........."],runA:["....###.##..........","....##....##........","....#...............","....##.............."],runB:["....###.##..........","....##...#..........","..........#.........",".........##........."]};
const GY0=300; const CLOUDS=[[180,70],[520,110],[820,60]];
function drawRex(c,cx,by,cell,legs,blink,rot){ const rows=REX_HEAD.concat(REX_LEGS[legs]||REX_LEGS.stand), n=rows.length;
  c.save(); c.translate(cx,by); if(rot) c.rotate(rot); c.fillStyle='#535353';
  for(let r=0;r<n;r++){ const row=rows[r]; for(let k=0;k<row.length;k++) if(row[k]==='#') c.fillRect((k-10)*cell,(r-n)*cell,cell+.6,cell+.6); }
  c.fillStyle=blink?'#535353':'#f7f7f7'; c.fillRect((11-10)*cell+cell,(1-n)*cell,cell,cell); c.fillStyle='#f7f7f7'; if(!blink) c.fillRect((12-10)*cell-cell,(1-n)*cell,cell,cell);
  c.restore(); }
function drawClassic(){
  let a=0; const T=introT; if(st==='ready'||st==='end') a=1; else if(st==='intro') a=T<.95?1:Math.max(0,1-(T-.95)/.35); else if(st==='outro') a=outroT<.72?0:Math.min(1,(outroT-.72)/.22); if(a<=0) return;
  const GY=300, run=st==='intro'?Math.min(T,.7):0, gOff=(st==='intro'?T*720:t*0);
  x.save(); x.setTransform(1,0,0,1,0,0); x.globalAlpha=a; x.fillStyle='#f7f7f7'; x.fillRect(0,0,W,H);
  x.fillStyle='#dadada'; CLOUDS.forEach(([cx0,cy],i)=>{ const cx=((cx0-t*8*(i+1)-gOff*.1)%(W+120)+W+120)%(W+120)-60; x.fillRect(cx-28,cy,64,4); x.fillRect(cx-18,cy-6,40,6); x.fillRect(cx-8,cy-12,20,6); x.fillStyle='#f7f7f7'; x.fillRect(cx-24,cy+4,56,2); x.fillStyle='#dadada'; });
  x.fillStyle='#535353'; x.fillRect(0,GY,W,2);
  for(let i=0;i<40;i++){ const bx=((i*97+13-gOff)%W+W)%W, by=GY+8+((i*37)%18); x.fillRect(bx,by,(i%3)+2,2); if(i%5===0) x.fillRect(bx+30,GY-2,6,2); }
  /* score row like the original */
  x.font='16px "Press Start 2P",monospace'; x.textAlign='right'; x.fillStyle='#757575'; x.fillText('HI '+String(hi).padStart(5,'0')+'  '+String(st==='end'||st==='outro'?Math.floor(score):0).padStart(5,'0'),W-30,48);
  if(st==='end'){ x.textAlign='center'; x.fillStyle='#535353'; x.font='22px "Press Start 2P",monospace'; x.fillText('Y O U   S U R V I V E D',W/2,128); x.font='11px "Press Start 2P",monospace'; x.fillStyle='#757575'; x.fillText('THE WORLD EXPLODED. YOU MADE IT TO THE CAVE.',W/2,162); x.fillText('SCORE '+Math.floor(score)+'   TIME '+fmtT(runT)+(lastRank?'   #'+lastRank+' ON YOUR BOARD':''),W/2,186); x.fillStyle='#535353'; if(Math.floor(t*1.6)%2===0) x.fillText('PRESS SPACE OR TAP TO PLAY AGAIN',W/2,226);
    x.fillStyle='#535353'; const cx=W-210; x.fillRect(cx-60,GY-2,120,4); x.fillStyle='#f7f7f7'; x.fillRect(cx-44,GY-2,88,2); x.fillStyle='#9a9a9a'; for(let i=0;i<5;i++) x.fillRect(cx-40+i*18,GY-8-((i*7)%10),6,4); }
  if(st==='ready'){ x.textAlign='center'; x.font='14px "Press Start 2P",monospace'; x.fillStyle='#535353'; if(Math.floor(t*1.6)%2===0) x.fillText('PRESS SPACE OR TAP TO PLAY',W/2,170); x.font='10px "Press Start 2P",monospace'; x.fillStyle='#9a9a9a'; x.fillText('🪙 '+totalCoins+'   ·   🏆 SCORES   ·   ⚙ SETTINGS',W/2,206); }
  if(st==='intro'){ const cx=W+40-T*900; if(cx>-40) sprite(cx,GY+2,UN*0+1,CAC,56,0,'#535353'); }
  if(st==='ready'||st==='end') drawRex(x,140,GY+6,4,'stand',(t%3.2)<.14);
  else if(st==='intro'&&T<.7) drawRex(x,140+run*170,GY+6,4,Math.floor(T*14)%2?'runA':'runB',false);
  x.restore(); }
/* the leap: the flat dino jumps out of the old screen, grows past the edges, and lands as the 3D dino */
function drawPop(){
  if(!POP){ POP=document.createElement('canvas'); POP.id='pop'; POP.style.cssText='position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:40'; document.body.appendChild(POP); popx=POP.getContext('2d'); }
  const dpr=Math.min(2,devicePixelRatio||1), vw=innerWidth, vh=innerHeight; if(POP.width!==Math.round(vw*dpr)||POP.height!==Math.round(vh*dpr)){ POP.width=Math.round(vw*dpr); POP.height=Math.round(vh*dpr); }
  popx.setTransform(1,0,0,1,0,0); popx.clearRect(0,0,POP.width,POP.height);
  if(st==='outro'){ const r=cv.getBoundingClientRect(), k=r.width/W, T=outroT; popx.setTransform(dpr*k,0,0,dpr*k,dpr*r.left,dpr*r.top);
    if(T<.8){ const u=T/.8, e=u*u*(3-2*u), z=lerp(1,3.4,e), gy=lerp(H*.95,H*.5+78*3.4,e); popx.save(); popx.translate(W/2,gy); popx.scale(z,z); popx.rotate(Math.sin(u*Math.PI)*.1); popx.shadowColor='rgba(0,0,0,.4)'; popx.shadowBlur=24*e; popx.shadowOffsetY=18*e; const keep=x, ph=P.h; x=popx; P.h=.01; dino(0,0,false,true,u>.35); x=keep; P.h=ph; popx.restore(); if(T>.3&&T<.34) beep(660,.1,'square'); }
    if(T>=.68&&T<.98){ popx.fillStyle='rgba(255,255,255,'+(1-Math.abs(T-.8)/.18)+')'; popx.fillRect(-r.left/k,-r.top/k,vw/k,vh/k); }
    if(T>=.8){ const u=Math.min(1,(T-.8)/.7), e=1-Math.pow(1-u,3), cell=lerp(26,4,e), sx=lerp(W/2,140,e), sy=lerp(H*.5+26*10,GY0+6,e)-Math.sin(u*Math.PI)*70; drawRex(popx,sx,sy,cell,u<1?'runA':'stand',false,.1*Math.sin(u*Math.PI)); }
    return; }
  if(st!=='intro') return;
  const T=introT, r=cv.getBoundingClientRect(), k=r.width/W;
  popx.setTransform(dpr*k,0,0,dpr*k,dpr*r.left,dpr*r.top);
  if(T>=.7&&T<1.22){ const u=(T-.7)/.52, e=u*u*(3-2*u), cell=4+22*e, sx=lerp(140+.7*170,W/2,e), sy=lerp(306,H*.5+cell*10,e)-Math.sin(u*Math.PI)*90;
    popx.shadowColor='rgba(0,0,0,.35)'; popx.shadowBlur=30*e; popx.shadowOffsetY=20*e; drawRex(popx,sx,sy,cell,'runA',false,-.12*Math.sin(u*Math.PI)); popx.shadowColor='transparent';
    if(T>.86&&T<.9) beep(880,.12,'square'); }
  if(T>=1.12&&T<1.4){ popx.fillStyle='rgba(255,255,255,'+(1-Math.abs(T-1.22)/.18)+')'; popx.fillRect(-r.left/k,-r.top/k,vw/k,vh/k); }
  if(T>=1.22){ const u=Math.min(1,(T-1.22)/.98), e=u*u, z=lerp(3.4,1,e), gy=lerp(H*.5+78*3.4,YP,e);
    popx.save(); popx.translate(W/2,gy); popx.scale(z,z); popx.shadowColor='rgba(0,0,0,.35)'; popx.shadowBlur=24*(1-e); popx.shadowOffsetY=18*(1-e);
    const keep=x, ph=P.h; x=popx; P.h=u<.95?.01:0; dino(0,0,false,true,false); x=keep; P.h=ph; popx.restore(); }
}
function loop(ts){ const dt=Math.min(.05,(ts-last)/1000||0); last=ts; t+=dt; blendPal(dt); weather(dt); update(dt); draw(); drawPop(); requestAnimationFrame(loop); }
reset(); uiLabels(); requestAnimationFrame(loop);
